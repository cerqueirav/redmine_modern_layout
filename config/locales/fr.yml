  mui_login_feature_3: "Équipes et projets organisés"
  mui_login_bg: "Image d'arrière-plan"
  mui_login_bg_info: "Format recommandé : paysage, rapport 3:2 (1920 × 1280 px ; largeur minimale de 1600 px). L'image est recadrée pour remplir la zone ; gardez le contenu principal au centre. Facultatif : sans image, un dégradé des couleurs du thème est appliqué. Fichiers acceptés : JPG ou WEBP (recommandés), PNG ou SVG, jusqu'à 5 Mo."
  mui_partners: "Bandeau des partenaires"
  mui_partners_info: "Format recommandé : bandeau horizontal, rapport 12:1 (p. ex. 1400 × 116 px), fond transparent, logos de couleur foncée. Affichage : sur fond blanc, jusqu'à 56 px de hauteur. Fichiers acceptés : PNG, JPG, WEBP ou SVG, jusqu'à 2 Mo."
